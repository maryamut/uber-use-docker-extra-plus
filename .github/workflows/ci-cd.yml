name: CI and Image Delivery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      COMPOSE_PROJECT_NAME: georide-ci
      POSTGRES_DB: georide_ci
      POSTGRES_USER: georide_ci
      POSTGRES_PASSWORD: ci_only_temporary_password

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: |
          docker compose build api location matcher simulator-alpha

      - name: Start infrastructure
        run: |
          docker compose up -d --wait --wait-timeout 120 postgres redis rabbitmq
          ready=false
          for attempt in $(seq 1 60); do
            if docker compose exec -T rabbitmq rabbitmq-diagnostics -q check_running; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "RabbitMQ did not become ready"
            exit 1
          fi

      - name: Start application services
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120 api location matcher nginx
          ready=false
          for attempt in $(seq 1 60); do
            if docker compose exec -T matcher python -c "import requests; r=requests.get('http://location:8081/find-nearest-driver', params={'latitude':34.0522,'longitude':-118.2437}, timeout=5); r.raise_for_status()"; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "Location service did not become ready"
            exit 1
          fi

      - name: Test ride assignment
        run: python3 .github/smoke_test.py

      - name: Log in to container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Publish tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          repository="$DOCKERHUB_USERNAME"
          for service in api location matcher simulator-alpha; do
            source_image="georide-ci-${service}"
            target_image="${repository}/georide-${service}"
            docker tag "$source_image" "${target_image}:${GITHUB_SHA}"
            docker tag "$source_image" "${target_image}:latest"
            docker push "${target_image}:${GITHUB_SHA}"
            docker push "${target_image}:latest"
          done

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 150

      - name: Clean up temporary environment
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          docker logout

